<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1280px; height: 720px; overflow: hidden;
    font-family: "Noto Sans", sans-serif; color: #f1f5f9;
    background: radial-gradient(circle at 75% 45%, #1e2b4d 0%, #0a101d 70%);
    position: relative;
  }
  .title {
    position: absolute; left: 60px; top: 70px; width: 640px;
    font-weight: 900; font-size: 92px; line-height: 0.98; letter-spacing: -1px;
    text-shadow: 0 6px 24px rgba(0,0,0,0.6);
  }
  .title span { color: #facc15; }
  .price {
    position: absolute; left: 60px; bottom: 70px;
    background: #dc2626; padding: 10px 28px; border-radius: 18px;
    font-weight: 900; font-size: 64px; transform: rotate(-3deg);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .price small { font-size: 34px; font-weight: 800; opacity: .9; }
  .liter {
    position: absolute; right: 120px; top: 70px; width: 330px; height: 580px;
    border: 8px solid rgba(255,255,255,0.75); border-radius: 46px; overflow: hidden;
    display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .liter div { display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 40px; color: rgba(0,0,0,0.6); }
  .brand { position: absolute; right: 120px; bottom: 26px; font-weight: 800; font-size: 20px; letter-spacing: 3px; opacity: .8; }
  .q { position: absolute; right: 30px; top: 250px; font-size: 200px; font-weight: 900; color: #facc15; transform: rotate(12deg); text-shadow: 0 8px 30px rgba(0,0,0,0.7); }
</style>
</head>
<body>
  <div class="title">QUEM FICA COM O SEU <span>DINHEIRO?</span></div>
  <div class="price"><small>R$</small> 6,54 <small>/litro</small></div>
  <div class="liter">
    <div style="flex:32;background:#3b82f6">32%</div>
    <div style="flex:15;background:#84cc16">15%</div>
    <div style="flex:24;background:#f59e0b">24%</div>
    <div style="flex:3;background:#ef4444"></div>
    <div style="flex:26;background:#a855f7">26%</div>
  </div>
  <div class="q">?</div>
</body>
</html>
